<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    SchemeSpear favicon — replicates the S+spear mark from the navbar logo.
    Uses SchemeSpear's red/orange accent (#e84545 / #ff6b35) so the symbol
    reads clearly at 16×16, 32×32 and 48×48 in both dark and light browser tabs.
    The exact spear-S path geometry mirrors the lightning/spear bolt in the
    schemespear-logo-dark.png navbar asset.
  -->

  <!-- Background: transparent (no fill) so it adapts to browser chrome -->

  <!-- Main S-spear body -->
  <g transform="translate(50,50)">
    <!-- Outer S-curve ribbon — upper arc -->
    <path
      d="M -8,-36 C -20,-30 -22,-14 -12,-6 L 6,4 C 16,10 18,22 10,30 L -6,42"
      fill="none"
      stroke="url(#ss-grad)"
      stroke-width="14"
      stroke-linecap="round"
    />
    <!-- Outer S-curve ribbon — lower arc (mirrored) -->
    <path
      d="M 8,-42 C 20,-36 22,-22 12,-14 L -6,-4 C -16,2 -18,14 -10,22 L 6,34"
      fill="none"
      stroke="url(#ss-grad)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Spear tip — upper right arrowhead -->
    <polygon
      points="16,-30  30,-44  22,-18"
      fill="url(#ss-grad-tip)"
    />
    <!-- Spear base — lower left tail point -->
    <polygon
      points="-16,30  -30,44  -22,18"
      fill="#c0392b"
      opacity="0.85"
    />
  </g>

  <defs>
    <!-- Primary red-orange gradient — SchemeSpear accent -->
    <linearGradient id="ss-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff6b35"/>
      <stop offset="50%"  stop-color="#e84545"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <!-- Spear tip highlight -->
    <linearGradient id="ss-grad-tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffaa5e"/>
      <stop offset="100%" stop-color="#e84545"/>
    </linearGradient>
  </defs>
</svg>