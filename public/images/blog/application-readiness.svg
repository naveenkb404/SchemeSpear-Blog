<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid-9" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a24" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="glow-9">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad-9)"/>
  <rect width="1200" height="675" fill="url(#grid-9)"/>

  <!-- Title -->
  <text x="60" y="70" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#e63946" letter-spacing="3">END-TO-END BENEFICIARY PIPELINE</text>
  <text x="60" y="105" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">FROM DISCOVERY TO APPLICATION READINESS</text>

  <!-- Horizontal Timeline Line -->
  <line x1="100" y1="340" x2="1100" y2="340" stroke="#222233" stroke-width="4"/>
  <line x1="100" y1="340" x2="1100" y2="340" stroke="#e63946" stroke-width="3" stroke-dasharray="142 1" filter="url(#glow-9)"/>

  <!-- 7 Milestones -->
  <!-- 01 DISCOVER -->
  <g transform="translate(100, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">01</text>
    <rect x="-65" y="-120" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="-95" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">DISCOVER</text>
    <text x="0" y="-75" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">Identify Need</text>
  </g>

  <!-- 02 UNDERSTAND -->
  <g transform="translate(266, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">02</text>
    <rect x="-65" y="50" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">UNDERSTAND</text>
    <text x="0" y="95" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">AI Intent Parsing</text>
  </g>

  <!-- 03 VERIFY -->
  <g transform="translate(432, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">03</text>
    <rect x="-65" y="-120" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="-95" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">VERIFY</text>
    <text x="0" y="-75" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">₹5L Rule Check</text>
  </g>

  <!-- 04 PLAN -->
  <g transform="translate(598, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">04</text>
    <rect x="-65" y="50" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">PLAN</text>
    <text x="0" y="95" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">EMI Repayment</text>
  </g>

  <!-- 05 PREPARE -->
  <g transform="translate(764, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">05</text>
    <rect x="-65" y="-120" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="-95" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">PREPARE</text>
    <text x="0" y="-75" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">DPR Checklist</text>
  </g>

  <!-- 06 ROUTE -->
  <g transform="translate(930, 340)">
    <circle cx="0" cy="0" r="22" fill="#111118" stroke="#e63946" stroke-width="2.5"/>
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">06</text>
    <rect x="-65" y="50" width="130" height="70" rx="8" fill="#14141f" stroke="#222233" stroke-width="1"/>
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946" text-anchor="middle">ROUTE</text>
    <text x="0" y="95" font-family="Inter, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle">102 Partners</text>
  </g>

  <!-- 07 ACT -->
  <g transform="translate(1096, 340)">
    <circle cx="0" cy="0" r="26" fill="#e63946" stroke="#ffffff" stroke-width="3" filter="url(#glow-9)"/>
    <text x="0" y="6" font-family="JetBrains Mono, monospace" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">07</text>
    <rect x="-70" y="-120" width="140" height="70" rx="8" fill="#1a2e22" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="0" y="-95" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#2ecc71" text-anchor="middle">ACT</text>
    <text x="0" y="-75" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Credit Sanction</text>
  </g>

  <!-- Card Overlay Box below -->
  <rect x="250" y="530" width="700" height="80" rx="10" fill="#111118" stroke="#222230" stroke-width="1"/>
  <text x="600" y="565" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">TRANSFORMING PASSIVE INFORMATION SEARCH INTO COMPLETE PRE-APPLICATION READINESS</text>
  <text x="600" y="590" font-family="JetBrains Mono, monospace" font-size="11" fill="#888899" text-anchor="middle">SCHEMESPEAR SIH 2026 ARCHITECTURE · DISCOVER → UNDERSTAND → VERIFY → PLAN → PREPARE → ROUTE → ACT</text>
</svg>
