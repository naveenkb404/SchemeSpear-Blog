<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a24" stroke-width="1" opacity="0.6"/>
    </pattern>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Header Text -->
  <text x="60" y="70" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#e63946" letter-spacing="3">MULTI-FACTOR SCHEME MATCHING ENGINE</text>
  <text x="60" y="105" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">BENEFICIARY PROFILE MATCHING FUNNEL</text>

  <!-- Left Side: Profile Input Node -->
  <rect x="60" y="170" width="280" height="380" rx="12" fill="#111118" stroke="#222230" stroke-width="1.5"/>
  <rect x="60" y="170" width="280" height="4" fill="#e63946"/>
  <text x="90" y="210" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#e63946" letter-spacing="2">01 · BENEFICIARY PROFILE</text>
  
  <!-- Profile Items -->
  <g transform="translate(90, 240)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#181824" stroke="#2a2a3c" stroke-width="1"/>
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#8888a0">PURPOSE / TRADE</text>
    <text x="15" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Small Food Processing</text>
  </g>

  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#181824" stroke="#2a2a3c" stroke-width="1"/>
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#8888a0">ESTIMATED COST</text>
    <text x="15" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">₹2,00,000</text>
  </g>

  <g transform="translate(90, 380)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#181824" stroke="#2a2a3c" stroke-width="1"/>
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#8888a0">ANNUAL FAMILY INCOME</text>
    <text x="15" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">₹3,50,000 (&lt; ₹5L Cap)</text>
  </g>

  <g transform="translate(90, 450)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#181824" stroke="#2a2a3c" stroke-width="1"/>
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#8888a0">LOCATION / CATEGORY</text>
    <text x="15" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Tamil Nadu · SC Category</text>
  </g>

  <!-- Connecting Stream Lines -->
  <path d="M 340 360 C 420 360, 420 250, 480 250" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow)"/>
  <path d="M 340 360 C 420 360, 420 360, 480 360" fill="none" stroke="#e63946" stroke-width="2.5"/>
  <path d="M 340 360 C 420 360, 420 470, 480 470" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow)"/>

  <!-- Center: Engine Processing Nodes -->
  <g transform="translate(480, 210)">
    <rect x="0" y="0" width="240" height="80" rx="8" fill="#14141f" stroke="#e63946" stroke-width="1.5"/>
    <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946">02 · AI PROFILE (NLP)</text>
    <text x="20" y="55" font-family="Inter, sans-serif" font-size="12" fill="#cccccc">Intent Extraction Schema</text>
  </g>

  <g transform="translate(480, 320)">
    <rect x="0" y="0" width="240" height="80" rx="8" fill="#14141f" stroke="#e63946" stroke-width="2" filter="url(#glow)"/>
    <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946">03 · SCHEME RAG DB</text>
    <text x="20" y="55" font-family="Inter, sans-serif" font-size="12" fill="#ffffff">pgvector Similarity Index</text>
  </g>

  <g transform="translate(480, 430)">
    <rect x="0" y="0" width="240" height="80" rx="8" fill="#14141f" stroke="#e63946" stroke-width="1.5"/>
    <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#e63946">04 · RULE ENGINE</text>
    <text x="20" y="55" font-family="Inter, sans-serif" font-size="12" fill="#cccccc">Deterministic ₹5L Cap Check</text>
  </g>

  <!-- Connecting Lines to Output -->
  <path d="M 720 250 C 780 250, 780 360, 840 360" fill="none" stroke="#e63946" stroke-width="2"/>
  <path d="M 720 360 L 840 360" fill="none" stroke="#e63946" stroke-width="3" filter="url(#glow)"/>
  <path d="M 720 470 C 780 470, 780 360, 840 360" fill="none" stroke="#e63946" stroke-width="2"/>

  <!-- Right Side: Matched Output Card -->
  <rect x="840" y="230" width="300" height="260" rx="12" fill="#12121c" stroke="#2ecc71" stroke-width="2"/>
  <rect x="840" y="230" width="300" height="4" fill="#2ecc71"/>
  
  <text x="870" y="270" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#2ecc71" letter-spacing="2">MATCHED OUTPUT</text>
  <text x="870" y="305" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">TERM LOAN SCHEME</text>
  
  <text x="870" y="340" font-family="Inter, sans-serif" font-size="12" fill="#aaaaaa">• Income ≤ ₹5,00,000 Verified</text>
  <text x="870" y="365" font-family="Inter, sans-serif" font-size="12" fill="#aaaaaa">• Cost > ₹1.40L (Term Loan)</text>
  <text x="870" y="390" font-family="Inter, sans-serif" font-size="12" fill="#aaaaaa">• Max Beneficiary Loan: ₹45L</text>
  
  <rect x="870" y="415" width="240" height="36" rx="6" fill="#1a2e22" stroke="#2ecc71" stroke-width="1"/>
  <text x="890" y="438" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#2ecc71">STATUS: POTENTIAL MATCH</text>

  <!-- Technical Overlay Metadata -->
  <text x="60" y="625" font-family="JetBrains Mono, monospace" font-size="11" fill="#444455">SCHEMESPEAR AI ARCHITECTURE · VECTOR SIMILARITY + RULE VERIFICATION ENGINE</text>
</svg>
